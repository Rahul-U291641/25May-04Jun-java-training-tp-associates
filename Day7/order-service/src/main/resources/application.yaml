# Server Configurations
server:
  port: 8082

# Spring & Kafka Configurations
spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    producer:
      bootstrap-server: localhost:9092

# Custom Configurations
order:
  kafka:
    topics:
      order: order-events

    groups:
      order: order-group